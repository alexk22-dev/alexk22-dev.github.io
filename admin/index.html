<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep this page out of search engines; it is an unlinked, URL-only admin entry. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager</title>
    <!-- Load config by ABSOLUTE path so it works whether the page is served as
         /admin or /admin/ (a relative ./config.yml 404s when there's no trailing slash). -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!--
      Sveltia CMS admin entry point.

      Sveltia CMS is a drop-in, config-compatible successor to Decap/Netlify
      CMS with a much better editor (Lexical-based rich text with first-class
      code blocks and drag-and-drop/paste images plus a real media library).
      We switched off Decap purely to get that editor; the GitHub backend and
      our existing EXTERNAL OAuth provider keep working unchanged (Sveltia
      reuses the same Decap/Netlify-style base_url + auth_endpoint handshake).
      See: https://sveltiacms.app/en/docs/migration/netlify-decap-cms

      This file is INTENTIONALLY unlinked from the rest of the site (hidden,
      URL-only). Sveltia reads the config via the <link rel="cms-config-url">
      below (absolute /admin/config.yml so it resolves with or without a
      trailing slash).

      IMPORTANT: load the Sveltia bundle WITHOUT type="module". Sveltia ships
      as a single self-initializing classic script and its own docs explicitly
      warn that adding type="module" is unnecessary and can cause unexpected
      behavior (see https://sveltiacms.app/en/docs/start).

      The CDN URL below is PINNED to an exact version (0.266.0, the one the
      Homepage collections were tested against), so a Sveltia release can't
      break the admin. To upgrade, change the version, load /admin/ and open a
      Homepage item and a blog post before saving anything.

      THE PREVIEW PANE — see preview.js (previously preview-math.js; it now
      does considerably more than math). Sveltia shipped
      `registerPreviewTemplate` in v0.169.0 (2026-06-29,
      https://github.com/sveltia/sveltia-cms/releases/tag/v0.169.0), so a custom
      preview component can load the site's own stylesheet into the preview
      iframe, emulate the Liquid tags used in post bodies, and typeset LaTeX
      with MathJax. preview.js does that; it must load AFTER the CMS bundle
      below, since it calls window.CMS.

      Note the version dependency: preview.js needs Sveltia >= 0.169.0.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.266.0/dist/sveltia-cms.js"></script>
    <script src="/admin/preview.js"></script>
  </body>
</html>
