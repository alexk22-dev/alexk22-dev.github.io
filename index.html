  --out: .43;                 /* … and what a filter leaves out (inert), further still: its text stays 3:1 on the paper and on a plate */
  /* the gel (the Gel view and the panel's lane): the slab's face and side, its wells, the lane tracks, the band ramp (weight 0 → 1),
     the ladder and the hover guide (a lane's smear is the stain at --b3, thinned). The default stain is UV: bands fluoresce orange on a near-black slab, whatever the page's theme.
     The wells are a shade lighter than the slab, the one way a slot shows on near-black. On a dark page the slab goes a shade blacker and takes a hairline (--gel-line), so it still reads as a slab.
     The corner's switch picks the gel (html.gel-agarose | gel-sds | gel-western; ?gel=agarose|sds|western, or the older ?stain=uv|coomassie,

/* ================================================================ end of knobs */
:root { --m: 96px; --g: 24px; --sep: color-mix(in srgb, var(--paper) 35%, transparent); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; overflow-x: clip; background: var(--paper); }
html.locked { overflow: hidden; }
body {

}
a { color: inherit; text-decoration: underline 1px var(--rule); text-underline-offset: 4px; }
@media (hover: hover) and (pointer: fine) { a:hover { color: var(--hover); text-decoration-color: currentColor; } }

.controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 var(--g); margin-top: 8px; }
.links, .seg { display: flex; flex-wrap: wrap; align-items: center; gap: 0 20px; }
.links a { gap: 7px; }
.links svg { width: 15px; height: 15px; flex: none; }
.links a, .seg button { font-family: var(--label); font-size: var(--fs-ui); line-height: 1; min-height: 44px; display: inline-flex; align-items: center; color: var(--mute); text-decoration: underline 1px transparent; text-underline-offset: 6px; }

.seg button[aria-pressed="true"] { font-weight: 500; }
@media (hover: hover) and (pointer: fine) { .links a:hover, .seg button:hover { color: var(--hover); } }
.seg button, .links a { position: relative; }
.links a::after { content: ""; position: absolute; top: 0; bottom: 0; left: min(0px, (100% - 44px) / 2); right: min(0px, (100% - 44px) / 2); }
/* hit areas grow only by what a control lacks of 44px, so they never reach for neighbours */
.seg button::after { content: ""; position: absolute; top: 0; bottom: 0; left: min(0px, (100% - 44px) / 2); right: min(0px, (100% - 44px) / 2); }
.seg button[aria-pressed="true"] { color: var(--ink); text-decoration-color: var(--ink); }
/* the filter: same words as the views, the one on underlined rather than heavier */
.filt { margin-left: auto; margin-right: 40px; }

@media (hover: hover) and (pointer: fine) { .rp:hover { color: var(--hover); } }
.rp:active { color: var(--ink); }
.filt button[aria-pressed="true"] { font-weight: 400; text-decoration: underline 1px currentColor; text-underline-offset: 6px; }

.corner, .gels { display: flex; gap: 0 16px; }

   - its core, --T thick (never under --bmin, which the Gel sets where the slab is drawn small), runs from the stain at --c, a shade nearer
     --b2 at its rim, to a shade hotter (--b4) just ahead of the middle; outside the core it fades out, over --e behind (the diffuse side) and --f ahead, more on a fat band;
   - its ends are rounded and fade out, over 2.2u: over the band lies a strip of the slab's own colour (--gel) with an elliptical hole in it,
     no taller than the band, so it takes the corners and nothing else; the arc stops 1u short of the strip's ends, so no rounding
     leaves a sliver of it uncovered.
   Two gradients: no filter, and no mask either (a mask on every band cost the turn frames on a slow machine) */
.cell { position: absolute; left: 0; top: 0; translate: 0 0 .5px; cursor: pointer; transition: opacity .16s linear; }
.cell, .zcell, .strip i, .tb { --u: 1px; --T: max(calc(var(--t, 0) * 28 * var(--u)), var(--bmin, 0px)); --R: calc(var(--w, 24) * var(--w, 24) / 14.4 * var(--u));
  --e: calc(1.5 * var(--u) + .2 * var(--T)); --f: calc(1.1 * var(--u) + .1 * var(--T)); --ce: color-mix(in srgb, var(--c) 80%, var(--b2)); }
.cell::before, .zcell::before, .strip i::before { content: ""; position: absolute; inset: 0 calc(2 * var(--u)); }
/* no --c, no weight: the gradient is then invalid, and nothing is drawn */
.cell::before, .zcell::before, .strip i::before, .tb {
  background: radial-gradient(ellipse 50% calc(.9 * var(--T) + 9 * var(--u)), transparent calc(100% - 2.2 * var(--u)), var(--gel) 100%) 50% / 100% calc(var(--T) + var(--e) + var(--f) + 4 * var(--u)) no-repeat,
    radial-gradient(circle at 50% calc(50% + .9 * var(--u) - var(--R)), transparent calc(var(--R) - var(--T) / 2 - var(--e)), color-mix(in srgb, var(--c) 30%, transparent) calc(var(--R) - var(--T) / 2 - .5 * var(--e)),
    var(--ce) calc(var(--R) - var(--T) / 2), color-mix(in srgb, var(--c) 78%, var(--b4)) calc(var(--R) + .12 * var(--T)), var(--ce) calc(var(--R) + var(--T) / 2),
    color-mix(in srgb, var(--c) 30%, transparent) calc(var(--R) + var(--T) / 2 + .5 * var(--f)), transparent calc(var(--R) + var(--T) / 2 + var(--f))) 50% / calc(100% - 2 * var(--u)) 100% no-repeat; }
/* wells along the top of every lane; the ladder is one lane of thin, even bands beside the topic names, soft at the edge like the rest.
   Under a loaded well runs the lane's smear (--lane-h long, to its last band; --sm: how far it has run, in the intro): faint, strongest at the
   well and gone within 190px, its sides faded into the slab the way a band's ends are (--gel over them), so lanes never read as ruled tracks */
.well, .lad { position: absolute; left: 0; top: 0; translate: 0 0 .25px; pointer-events: none; transition: opacity .16s linear; }
.well { background: var(--well); }
.well:not(.lw)::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: var(--lane-h, 0); transform-origin: 50% 0; transform: scaleY(var(--sm, 1));
  background: linear-gradient(90deg, var(--gel), transparent 30%, transparent 70%, var(--gel)),
    linear-gradient(color-mix(in srgb, var(--b3) 10%, transparent), color-mix(in srgb, var(--b3) 6.5%, transparent) min(14px, 8%), color-mix(in srgb, var(--b3) 4%, transparent) min(40px, 22%), color-mix(in srgb, var(--b3) 2.2%, transparent) min(80px, 42%), color-mix(in srgb, var(--b3) 1%, transparent) min(130px, 66%), transparent min(190px, 100%)); }
.lad { background: var(--ladder); border-radius: 1px; box-shadow: 0 0 1.2px color-mix(in srgb, var(--ladder) 70%, transparent); }
.labs { position: absolute; inset: 0; pointer-events: none; }
.labs .lbl { pointer-events: auto; z-index: 1; }
.labs .lead, .labs .clbl { pointer-events: none; }
.labs .lead { z-index: 0; }
.labs .ilbl { z-index: 2; }   /* a name wins any tap its heading's widened hit band overlaps */
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; transform-origin: 0 0; color: var(--ink); transition: opacity .16s linear; }
/* names: level over their columns (lv) or rising at --map-slant (sl) */
.ilbl .nm { display: block; }
.ilbl .cx { display: none; }
.ilbl.lv { padding: 1px 4px; text-align: center; white-space: normal; width: max-content; max-width: 136px; background: var(--paper); }
.ilbl.lv .nm, .ilbl.sl .nm { font: 400 calc(var(--fs-item) * var(--nmk, 1) * var(--lk, 1))/1.2 var(--serif); }   /* --nmk: set by the Map's layout where the names must shrink to stay apart; --lk: where wide lanes let every label grow (--label-fit) */
.ilbl.sl { padding: 1px 2px; }
/* stacked on phones a slanted name is a band as thick as the gap to the next name (--nb each side), so every tap finds one, and at least 44px long */
.stage.ph .ilbl.sl::after { content: ""; position: absolute; left: 0; right: min(0px, 100% - 44px); top: calc(-1 * var(--nb, 0px)); bottom: calc(-1 * var(--nb, 0px)); }
.ilbl.hl .nm { color: var(--mark); }
@media (hover: hover) and (pointer: fine) { .ilbl:hover .nm { color: var(--mark); } }
.ilbl:focus-visible { outline: none; }
.ilbl:focus-visible .nm { color: var(--mark); }
/* group headings: a 44px band around the 20px line */
.glbl { font: 500 calc(var(--fs-group) * var(--lk, 1))/calc(20px * var(--lk, 1)) var(--label); color: var(--ink); text-decoration: underline 1px transparent; text-underline-offset: 5px; }
.glbl::after { content: ""; position: absolute; left: -4px; right: -4px; top: -12px; bottom: -12px; }
.glbl[aria-pressed="true"] { text-decoration-color: currentColor; }
.glbl:focus-visible { outline: none; color: var(--mark); }
@media (hover: hover) and (pointer: fine) { .glbl:hover { color: var(--hover); } }
/* topics: beside the rows of the first plane (of every plane on phones) */
.clbl { font: 400 calc(var(--fs-head) * var(--lk, 1))/1.2 var(--label); color: var(--ink); background: var(--paper); padding: 0 3px; }
.clbl.hl { color: var(--mark); }
.lead { position: absolute; left: 0; top: 0; width: 1px; height: 0; background: var(--rule); transform-origin: 0 0; }
.stage.focus .cell:not(.hl), .stage.focus .well:not(.hl):not(.lw), .stage.focus .lbl:not(.hl) { opacity: var(--fade); transition: none; }
.stage .off, .lbl.wait, .stage .pending { visibility: hidden; pointer-events: none; }
.stage .off.leave { visibility: visible; }
.stage .off:not(.leave) { display: none; }
.stage.introing .lbl, .stage.introing .cell { pointer-events: none; }
.stage.introing .cell, .stage.introing .lad { transition: none; will-change: transform, opacity; }
.stage.dragging, .stage.dragging * { cursor: grabbing !important; }
.arcs { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; }
.arcs path { fill: none; stroke: var(--guide); stroke-width: 1; stroke-dasharray: 1; }

/* the intro: the work's own words fill the viewport (.corpus, a canvas); one of each lane name and topic lifts out of it as a .fly, set
   exactly as the label it lands on (it borrows the label's classes), and the gel is loaded behind it */
.corpus { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; }
.fly { position: fixed; left: 0; top: 0; z-index: 31; pointer-events: none; white-space: nowrap; color: var(--mark); transform-origin: 0 0; will-change: transform, opacity; }   /* lit in the accent, ink by the time it lands */
.fly.ilbl, .fly.clbl { background: none; }
.fly { text-shadow: var(--fly-rim, none); }   /* where a slab is lighter than the words (the dark SDS-PAGE and Western pages), a hairline of the page keeps a crossing word */
html.intro-full { overflow: hidden; }
html.intro-full .head, html.intro-full #mapView { visibility: hidden; }
html.intro-full.intro-rise #mapView { visibility: visible; }
.skip { background: var(--paper); position: fixed; right: max(var(--m), env(safe-area-inset-right, 0px)); top: calc(40px + env(safe-area-inset-top, 0px)); z-index: 32; min-width: 44px; min-height: 44px; font: 15px var(--label); color: var(--mute); }
@media (hover: hover) and (pointer: fine) { .skip:hover { color: var(--ink); } }


/* ---------------------------------------------------------------- timeline: the same gel run over time; one slab, a lane per piece of work */
.stage.tl { cursor: auto; }
/* a band, the Gel view's drawing in a box of its own: as wide as a well, --T thick (set by the script) with room around it for the smile */
.tb { position: absolute; left: 0; top: 0; translate: 0 0 .5px; transform-origin: 50% 0; pointer-events: none; transition: opacity .16s linear; }
.lane { position: absolute; left: 0; top: 0; translate: 0 0 .75px; cursor: pointer; }
.stage.focus .tb:not(.hl) { opacity: var(--fade); transition: none; }
.stage.tl.focus .clbl { opacity: 1; }   /* the dates stay: the guide reads against them */


.hcard { position: fixed; left: 0; top: 0; z-index: 12; width: max-content; max-width: min(240px, calc(100vw - 32px)); padding: 12px; background: var(--card);
  border: 1px solid var(--rule); color: var(--ink); font-family: var(--label); visibility: hidden; pointer-events: none; }
.hcard.on { visibility: visible; }
.hcard.tap { pointer-events: auto; cursor: pointer; }
.hcard > img, .panel img { box-shadow: 0 0 0 1px var(--img-rule); }
.hcard > img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; margin-bottom: 8px; }
.hcard.small > img { display: none; }
.hcard .dt { display: block; font-size: 12px; line-height: 16px; color: var(--mute); font-variant-numeric: tabular-nums lining-nums; }
.hcard .cx { display: block; margin-top: 6px; font: 500 14px/18px var(--label); }
.hcard p { margin: 6px 0 0; font: 15px/20px var(--serif); }
.morph { position: fixed; inset: 0; z-index: 15; pointer-events: none; }
.morph > * { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }
.morph span { white-space: nowrap; line-height: 1; font-family: var(--label); color: var(--ink); }
.morph span.sf { font-family: var(--serif); }
/* a lane in flight between views, as a strip of gel with its bands: the lane runs along the strip, so a band's thickness is its width */
.morph .strip { display: grid; }
.strip i { display: block; position: relative; background: var(--gel); }
.strip i { --u: .357px; }
.strip i::before { rotate: -90deg; }   /* the cell's drawing on its side, the well end at the left */

.scrim { touch-action: none; position: fixed; inset: 0; height: 100vh; height: 100dvh; z-index: 19; background: var(--paper); opacity: 0; pointer-events: none; transition: opacity .18s linear; }
.scrim.on { opacity: 1; pointer-events: auto; }
.panel { --zs: 40px; position: fixed; inset: 0; height: 100vh; height: 100dvh; z-index: 20; overflow-y: auto; overscroll-behavior: contain;
  padding: 0 max(var(--m), env(safe-area-inset-right, 0px)) calc(72px + env(safe-area-inset-bottom, 0px)) calc(max(var(--m), env(safe-area-inset-left, 0px)) + var(--zs) + 120px); }
.panel.closed { visibility: hidden; pointer-events: none; }
.panel.closing { pointer-events: none; }
.panel.pre .pc, .panel.closing .pc, .panel.pre-l .zl, .panel.closing .zl { visibility: hidden; }
.panel:focus, .panel:focus-visible { outline: none; }
.pbar { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 2; }
.x { position: relative; width: 44px; height: 44px; color: var(--mute); }
.x::before, .x::after { content: ""; position: absolute; left: 12px; top: 21.25px; width: 20px; height: 1.5px; background: currentColor; transform: rotate(45deg); }
.x::after { transform: rotate(-45deg); }
@media (hover: hover) and (pointer: fine) { .x:hover { color: var(--ink); } }
.pc { max-width: 1120px; padding-top: 96px; display: grid; grid-template-columns: minmax(0, 62ch) minmax(0, 1fr); gap: 24px 48px; align-items: start; }
.panel h2 { grid-column: 1 / -1; font-weight: 500; font-size: 40px; line-height: 1.1; letter-spacing: -.01em; margin: 0; }
.panel .ctx { font: 500 17px/1.4 var(--label); margin: 0 0 8px; }
.panel .org { font: 15px/1.5 var(--label); color: var(--mute); margin: 0 0 12px; }
.panel .desc { margin: 0 0 12px; }
.panel ul { padding-left: 20px; margin: 0 0 16px; }
.panel li { margin: 4px 0; }
.panel figure { margin: 0; }
.panel img { width: 100%; height: auto; display: block; }
.tbl { border-collapse: collapse; font: 15px/1.5 var(--label); font-variant-numeric: tabular-nums lining-nums; margin: 0 0 16px; }
.tbl th { font-weight: 400; color: var(--mute); text-align: left; }
.tbl th, .tbl td { padding: 4px 24px 4px 0; border-bottom: 1px solid var(--rule); }
.tbl td + td, .tbl th + th { text-align: right; }
.panel .plinks { display: flex; gap: 0 20px; flex-wrap: wrap; margin-top: 8px; font: 500 15px var(--ui); }
.panel .plinks a { color: var(--mark); text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
@media (hover: hover) and (pointer: fine) { .panel .plinks a:hover { color: var(--hover); } }
.zcell { --u: calc(var(--zs) / 28); --e: calc(.8 * var(--u) + .09 * var(--T)); --f: calc(.6 * var(--u) + .05 * var(--T)); position: fixed; left: 0; top: 0; width: var(--zs); height: var(--zs); transform-origin: 0 0; z-index: 21; will-change: transform; }
/* the panel's strip is the item's lane, cut out of the gel: each cell a piece of slab (its spread closes the gaps) with its band; seen
   flat and larger, a band's edges fade over about half as many units as on the tilted slab, so they are as soft on screen */
.zcell { background: var(--gel); box-shadow: 0 0 0 2px var(--gel); }
.zcell:not(:last-of-type) { box-shadow: 0 0 0 2px var(--gel), 0 1px 0 2px var(--gel); }   /* … and laps the next by a pixel: no seam where a light lane lies on a dark page */
.zl { position: fixed; left: 0; top: 0; z-index: 21; font: 12px/12px var(--label); white-space: nowrap; color: var(--ink); }
.zl.z { color: var(--mute); }

/* ---------------------------------------------------------------- skills: the stack drawn as a model, bottom to top like a forward pass; the work it ran in beside it */
.sk { --sz: 1.18; position: relative; display: grid; grid-template-columns: max-content max-content; justify-content: center; align-content: center; align-items: center; column-gap: var(--skg, 160px); margin-top: 8px; user-select: none; -webkit-user-select: none; }
.stack { display: grid; grid-template-columns: max-content minmax(0, max-content); column-gap: calc(12px * var(--sz)); align-items: center; }
.stl { grid-column: 1; justify-self: end; font: 400 calc(var(--fs-head) * var(--sz))/1.2 var(--label); color: var(--mute); transition: color .16s linear; }
.blk { grid-column: 2; display: flex; flex-wrap: wrap; justify-content: center; gap: calc(6px * var(--sz)); padding: calc(8px * var(--sz)); background: var(--plate); box-shadow: inset 0 0 0 1px var(--edge); }
.blk.base { background: var(--edge); }
.sar { grid-column: 2; justify-self: center; position: relative; width: 1px; height: calc(22px * var(--sz)); color: color-mix(in srgb, var(--mute) 55%, var(--paper)); background: currentColor; transition: color .16s linear; }
.sar::before { content: ""; position: absolute; left: -3px; top: -1px; border: 3.5px solid transparent; border-top: 0; border-bottom: 6px solid currentColor; }
.sgap { grid-column: 2; height: calc(8px * var(--sz)); }
.chip { position: relative; z-index: 1; font: 400 calc(13px * var(--sz))/calc(16px * var(--sz)) var(--label); padding: calc(4px * var(--sz)) calc(8px * var(--sz)); white-space: nowrap; color: var(--ink); background: var(--paper); box-shadow: inset 0 0 0 1px var(--chip-rule); transition: color .16s linear, background-color .16s linear, box-shadow .16s linear; --bg: var(--plate); --dim: calc(var(--fade) * 100%); }
.blk.base .chip { --bg: var(--edge); }
span.chip { cursor: default; }
.its { display: flex; flex-direction: column; align-items: flex-start; }
.it { position: relative; font: 400 calc(var(--fs-item) * var(--sz))/calc(20px * var(--sz)) var(--serif); padding: calc(3px * var(--sz)) 0; white-space: nowrap; color: var(--ink); transition: opacity .16s linear; }
.it.g0 { margin-top: calc(10px * var(--sz)); }
.it:first-child { margin-top: 0; }
/* the links between skills run over the plates and under the chips */
.sklinks { position: absolute; z-index: 0; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.wires { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.wires path, .sklinks path { fill: none; stroke: var(--mark); stroke-width: 1; stroke-opacity: .7; stroke-dasharray: 1; stroke-linecap: round; }
/* a chip steps back by mixing into its plate, not by fading: a link running behind it stays hidden */
.sk.sel .chip:not(.on):not(.nb), .sk .chip.out { color: color-mix(in srgb, var(--ink) var(--dim), var(--bg)); background: color-mix(in srgb, var(--paper) var(--dim), var(--bg)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--chip-rule) var(--dim), var(--bg)); }
.sk .chip.out { --dim: calc(var(--out) * 100%); }
.sk.sel .it:not(.on) { opacity: var(--fade); }
.sk .it.out, .sk.sel .it.out { opacity: var(--out); }
.chip.on { color: var(--mark); box-shadow: inset 0 0 0 1.5px var(--mark); }
.chip.src { color: var(--paper); background: var(--mark); }
.chip.nb { color: var(--mark); box-shadow: inset 0 0 0 1px var(--mark); }
.it.on { color: var(--mark); }
.stl.on { color: var(--mark); }
.sar.on { color: var(--mark); }
.chip:focus-visible, .it:focus-visible { outline: none; }
.sk.mo-l .it { visibility: hidden; }
/* stacked: the work below the stack, as a wrapped list; stage names over their blocks */
@media (max-width: 760px) { .sk { --sz: 1.1; } }
.sk.col { grid-template-columns: minmax(0, 1fr); row-gap: 24px; justify-content: stretch; }
.sk.col .stack { grid-template-columns: minmax(0, 1fr); justify-self: center; max-width: 100%; }
.sk.col .stl { grid-column: 1; justify-self: start; display: flex; align-items: flex-end; height: 34px; padding-bottom: 4px; box-sizing: border-box; }
.sk.col .stl:first-child { height: auto; }
.sk.col .blk, .sk.col .sar, .sk.col .sgap { grid-column: 1; }
.sk.col .sar { height: 16px; margin: 9px 0 -25px; }   /* centred in the 34px gap between two boxes, beside the label */
.sk.col .its { flex-flow: row wrap; gap: 0 16px; }
.sk.col .it.g0 { margin-top: 0; }
.sk.col .wires { display: none; }
@media (pointer: coarse), (hover: none) {
  /* touch: every control is 44px to the finger; rows sit far enough apart that hit areas never reach a neighbour */
  .blk { gap: 8px; }
  button.chip { min-width: 44px; min-height: 36px; text-align: center; }
  button.chip::after { content: ""; position: absolute; left: min(0px, (100% - 44px) / 2); right: min(0px, (100% - 44px) / 2); top: -4px; bottom: -4px; }
  span.chip { min-height: 36px; display: inline-flex; align-items: center; }
  .it { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; padding: 0; }
}
@media (hover: hover) and (pointer: fine) { button.chip:hover, .it:hover { color: var(--mark); } button.chip.src:hover { color: var(--paper); } }
.chip:active, .it:active { color: var(--mark); }

/* ---------------------------------------------------------------- logos: one, small, beside a name; the dark variant or a light plate in dark mode */
.lg { display: inline-flex; align-items: center; vertical-align: -2px; margin-left: 6px; line-height: 0; }
.lg img { height: calc(14px * var(--ls, 1)); width: auto; max-width: 64px; object-fit: contain; }   /* 64: a 4.3:1 wordmark at 14px */
.lg .dk { display: none; }
/* on the map the logo leads its slanted name, at the foot of the column */
.ilbl .nm .lg { margin: 0 6px 0 0; }
.ilbl .nm .lg img { height: calc(min(14px * var(--ls, 1), 19px) * var(--nmk, 1) * var(--lk, 1)); max-width: calc(64px * var(--lk, 1)); }   /* 19: the tallest that keeps the slanted names full size at 1280; --nmk shrinks with the names */
.ilbl.rw .lg img { height: calc(15px * var(--ls, 1)); }
/* Skills items: 19 is the tallest that keeps an item its height */
.it .lg img { height: min(calc(15px * var(--ls, 1)), 19px); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .lg.dv .lt { display: none; }
  :root:not([data-theme="light"]) .lg.dv .dk { display: block; }
  :root:not([data-theme="light"]) .lg.lgp { background: var(--lgp); padding: 2px; border-radius: 2px; }
}
:root[data-theme="dark"] .lg.dv .lt { display: none; }
:root[data-theme="dark"] .lg.dv .dk { display: block; }
:root[data-theme="dark"] .lg.lgp { background: var(--lgp); padding: 2px; border-radius: 2px; }
.hcard .lgn { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; line-height: 16px; color: var(--mute); }
.hcard .lgn .lg { margin-left: 0; }
/* lettering (a small wordmark) fills its image edge to edge: set it to the cap height of the name beside it, not the line */
.lg.lgw img { height: 10px; }
.ilbl.rw .lg.lgw img, .it .lg.lgw img { height: 11px; }
.ilbl .nm .lg.lgw img { height: calc(9px * var(--nmk, 1) * var(--lk, 1)); }   /* over the gel too: lettering stays as small as the marks beside it */

/* header: filter, view tabs and replay hold together; on phones they rejoin the controls row, which sets them out itself */
.navr { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 0 var(--g); margin-left: auto; }
/* a narrow window, one filter word per group: the filter gives up some of its gap to the views before anything wraps */
@media (max-width: 899px) { .filt { margin-right: 16px; } }
@media (max-width: 760px) { .navr { display: contents; } }

/* taps: a quiet press state, accent for links and names, ink for controls */
a:active, .links a:active { color: var(--hover); }
.replay:active, .ilbl:active .nm, .glbl:active, .hcard.tap:active .dt { color: var(--mark); }
.seg button:active, .corner button:active, .skip:active, .x:active { color: var(--ink); }


@media (max-width: 1439px) { :root { --m: 72px; } }
@media (max-width: 1199px) { :root { --m: 48px; } }
@media (max-width: 760px) {
  :root { --m: 16px; --g: 16px; --fs-title: 40px; --fs-name: 15px; --fs-context: 12.5px; --fs-head: 12px; }
  .head { padding-top: calc(42px + env(safe-area-inset-top, 0px)); }   /* the gel switch has the line above the name to itself */
  .corner { top: calc(12px + env(safe-area-inset-top, 0px)); }
  .corner, .gels { gap: 0 18px; }
  .thesis { margin-top: 4px; }
  .controls { margin-top: 4px; }
  /* phones: the links stay on one row */
  .links { flex-wrap: nowrap; gap: 0 14px; }

    itemRect: i => (!$("#sklView").hidden && i >= 0) ? rectOf(itEl[i].querySelector(".nm")) : null };
}

/* ------------------------------------------------ intro replay */
// one replay at a time: mid-intro it starts over, mid-switch it waits for the Map, and presses during the fade-out are dropped
let replayT = 0, replayQ = false;
function replayIntro() {
  if (!MAP || REDUCED) return;
  if (MAP.introOn) { MAP.intro(clearIntroHash); return; }
  if (replayT || replayQ) return;
  closePanel(); CARD.hide();
  if (morphing) { replayQ = true; request({ mode: "map" }); return; }
  scrollTo(0, 0);
  if (state.mode !== "map") { want.mode = "map"; syncPressed(); swapView("map"); MAP.intro(clearIntroHash); return; }
  const st = $("#stage"); st.classList.add("fadeout");
  replayT = setTimeout(() => { replayT = 0; MAP.intro(clearIntroHash); }, T.s);
}
const clearIntroHash = () => { if (location.hash === "#intro") history.replaceState(null, "", location.pathname + location.search + baseHash()); };
for (const b of $$(".replay, .rp")) b.addEventListener("click", replayIntro);
if (REDUCED) $(".rp").remove();   // no intro to replay

const AWAY = 30 * 60e3, HIDDEN = 10 * 60e3;
const seen = () => store.set("ak-last", String(Date.now()));
setInterval(() => { if (!document.hidden) seen(); }, 60e3);
addEventListener("pagehide", seen);
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); seen(); return; }
  if (hiddenAt && Date.now() - hiddenAt > HIDDEN && MAP && canIntro() && !isOpen()) replayIntro();
  hiddenAt = 0; seen();
});

/* ------------------------------------------------ boot */
const introLikely = canIntro() && (location.hash === "#intro" || !store.get("ak-intro-seen") || Date.now() - (+store.get("ak-last") || 0) > AWAY);
if (introLikely) root.classList.add("intro-full"); else root.classList.remove("intro-full");
fetch("/assets/cool/data/work.json?v=971756757b").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
  // work.json → the names this page uses: group → type, start → event.date, axes[k].W → weights
  ITEMS = data.items.map(it => ({ ...it, type: it.group, event: { date: it.start } }));
  AXES = data.axes; GROUPS = data.groups;
  { const h = hashId(); if (isGroup(h)) state.filter = want.filter = h; }
  $("[data-filters]").innerHTML = [["all", "All"], ...GROUPS].map(([g, w]) => `<button type="button" data-filter="${esc(g)}" aria-pressed="false">${esc(w)}</button>`).join("");
  for (const b of $$("[data-filter]")) b.addEventListener("click", () => setFilter(b.dataset.filter));
  const site = data.site;
  if (COARSE) $(".name").textContent = site.name; else $(".replay").textContent = site.name;
  $("#thesis").textContent = site.tagline;
  $("[data-links]").innerHTML = site.links.map(([t, u, k]) => `<a href="${esc(u)}"${u.startsWith("mailto:") ? "" : ' target="_blank" rel="noopener"'}>${ICON[k] || ""}${esc(t)}</a>`).join("");
  // Topics only for now: the other axes stay in the data, unshown
  useAxis(Math.max(0, AXES.findIndex(a => a.id === "topics")));
  MAP = buildMap();
  MAP.rebuild();
  MAP.layout();
  SEQ = buildTimeline();
  if (data.skills) SKL = buildSkills(data.skills); else $("[data-mode=skl]").remove();
  syncPressed();
  const h = hashId();
  const away = Date.now() - (+store.get("ak-last") || 0) > AWAY;
  seen();
  // ?view=timeline or ?view=skills opens on that view (no intro: it belongs to the Gel)
  const v0 = { timeline: "seq", skills: SKL && "skl" }[new URLSearchParams(location.search).get("view")];
  if (v0) { want.mode = v0; swapView(v0); syncPressed(); }
  if (byId(h)) { root.classList.remove("intro-full"); openPanel(byId(h), true); }
  else {
    if (location.hash && h !== "intro" && !isGroup(h)) clearHash();
    if (!v0 && canIntro() && (h === "intro" || !store.get("ak-intro-seen") || away)) MAP.intro(clearIntroHash);
    else { root.classList.remove("intro-full"); clearIntroHash(); }
  }
  // test hook
  window.__site = { state, want, ITEMS, AXES, setMode, setFilter, setGel, get busy() { return morphing; }, get AX() { return AX; }, MAP, SEQ, SKL };
  document.body.dataset.ready = "1";
}).catch(err => {
  console.warn("work.json failed to load:", err);
  root.classList.remove("intro-full");
  $("#stage").innerHTML = `<p style="padding:16px;color:var(--mute)">Couldn’t load data/work.json.</p>`;
});
})();
</script>
